services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidencevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/evidencevault
      JWT_SECRET_KEY: change-me-in-production
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    volumes:
      - ../backend/uploads:/app/uploads
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
