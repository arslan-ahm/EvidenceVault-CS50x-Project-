[project]
name = "pathlib"
version = "1.0.1"
description = "Shim that overrides the abandoned PyPI pathlib backport with the stdlib implementation"
requires-python = ">=3.4"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pathlib"]
