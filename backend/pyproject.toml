[project]
name = "evidencevault-backend"
version = "0.1.0"
description = "EvidenceVault AI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.3.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.1",
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
  "pdfplumber>=0.11.4",
  "reportlab>=4.2.2",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
